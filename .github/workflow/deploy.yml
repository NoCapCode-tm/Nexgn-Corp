name: Production Deployment (CI/CD)

on:
  push:
    branches:
      - main # Change to 'master' if your repository uses the master branch

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Install dependencies (Bypasses React 19 peer dependency conflicts with react-scripts)
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # 4. Strip local Windows paths from package.json before building
      - name: Optimize package.json for Linux Environment
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.reactSnap && pkg.reactSnap.puppeteerExecutablePath) {
            delete pkg.reactSnap.puppeteerExecutablePath;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      # 5. Build application and pre-render static routes via react-snap
      - name: Execute System Production Build
        run: npm run build
        env:
          CI: false # Prevents warnings from terminating the build process

      # 6. Deploy compiled build folder (includes CNAME from public/) to gh-pages
      - name: Deploy Assets to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
          clean: true